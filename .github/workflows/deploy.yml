name: Deploy to IONOS VPS

on:
  push:
    branches: [master, feature-entrega2-IVB]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies & build assets
        run: |
          npm install
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure SSH Key & Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync
        run: |
          rsync -azP --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='database/database.sqlite' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/app/*' \
            --exclude='public/storage' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='.editorconfig' \
            --exclude='specs' \
            --exclude='.specify' \
            --exclude='CLAUDE.md' \
            --exclude='AGENTS.md' \
            --exclude='prompts.md' \
            --exclude='memory/' \
            --exclude='docs/' \
            --exclude='docker/' \
            --exclude='docker-compose*.yml' \
            -e "ssh -p ${{ secrets.VPS_PORT || 22 }}" \
            ./ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/vibo-invest/

      - name: Run post-deploy commands
        run: |
          ssh -p ${{ secrets.VPS_PORT || 22 }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            cd /var/www/vibo-invest

            # Run migrations
            php artisan migrate --force

            # Cache config, routes, and views for performance
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Create storage symlink if missing
            php artisan storage:link 2>/dev/null || true

            # Fix permissions
            chown -R www-data:www-data storage bootstrap/cache database
            chmod -R 775 storage bootstrap/cache database

            # Restart PHP-FPM to pick up changes
            sudo systemctl reload php8.4-fpm 2>/dev/null || sudo service php8.4-fpm reload 2>/dev/null || true

            echo "Deploy complete!"
          ENDSSH
